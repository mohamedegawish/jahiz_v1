# Full Jahez stack: MySQL + Laravel API + queue worker + scheduler + built frontend.
#
# Local usage (from this directory):
#   1. cp .env.docker.example .env.docker   # then fill in the secrets below
#   2. docker compose --env-file .env.docker -f docker-compose.yml -f docker-compose.local.yml up -d --build
#   3. docker compose --env-file .env.docker exec api php artisan app:check-production
#
# Coolify usage: deploy this repository as a "Docker Compose" resource with base
# directory = repository root. Do NOT add docker-compose.local.yml there.
# Every ${VAR} below becomes an editable variable in the Coolify UI
# (Environment Variables); ${VAR:?message} blocks deployment while empty.
# Configure two domains in Coolify, both pointing at internal port 80:
#   api service      -> https://api.example.com
#   frontend service -> https://app.example.com
# Then set APP_URL / FRONTEND_URL / FRONT_API_URL / CORS_ALLOWED_ORIGINS
# to those domains (see .env.docker.example).
#
# No service publishes host ports: traffic enters only through the Coolify
# proxy (TLS), and services reach each other by service name. Only the api
# service migrates and seeds the reference data on start (RUN_MIGRATIONS=true);
# the queue worker and the scheduler wait until it is healthy. An update is:
#   git pull && docker compose up -d --build   (Coolify: redeploy / webhook)
# Back up the database and the api-storage volume before an update
# (jahez_api/docs/deployment.md §6).
#
# The frontend bakes FRONT_API_URL at build time: changing it requires a
# rebuild (`docker compose up -d --build frontend`, or a Coolify redeploy).

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-jahez}
      MYSQL_USER: ${DB_USERNAME:-jahez}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.docker (local) or the Coolify environment variables}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env.docker (local) or the Coolify environment variables}
    volumes:
      - mysql-data:/var/lib/mysql
    expose:
      - "3306"
    healthcheck:
      # CMD-SHELL (not CMD): the password must expand from the container environment.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  api:
    build: ./jahez_api
    restart: unless-stopped
    environment:
      # The one service that migrates and seeds the reference data on start.
      RUN_MIGRATIONS: "true"
      # Optional start-up steps (jahez_api/docker/api-entrypoint.sh). The first IMC
      # administrator is created once, while INITIAL_ADMIN_EMAIL is set; clear
      # INITIAL_ADMIN_PASSWORD after the first deploy. SEED_DEMO_DATA seeds the demo data
      # set only under APP_ENV=local (the seeder refuses in production).
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_NAME: ${INITIAL_ADMIN_NAME:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      APP_NAME: ${APP_NAME:-Jahez}
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_KEY: ${APP_KEY:?Generate with `php artisan key:generate --show` and paste it here}
      APP_URL: ${APP_URL:?Set the public HTTPS API URL, e.g. https://api.example.com}
      FRONTEND_URL: ${FRONTEND_URL:?Set the public HTTPS frontend URL, e.g. https://app.example.com}
      # stderr: the container log (docker logs / Coolify), not a file in the shared volume.
      LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
      LOG_LEVEL: ${LOG_LEVEL:-warning}
      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-jahez}
      DB_USERNAME: ${DB_USERNAME:-jahez}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.docker (local) or the Coolify environment variables}
      SESSION_DRIVER: ${SESSION_DRIVER:-array}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
      CACHE_STORE: ${CACHE_STORE:-database}
      SANCTUM_EXPIRATION: ${SANCTUM_EXPIRATION:-480}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-*}
      API_RATE_LIMIT_PER_MINUTE: ${API_RATE_LIMIT_PER_MINUTE:-60}
      API_USER_RATE_LIMIT_PER_MINUTE: ${API_USER_RATE_LIMIT_PER_MINUTE:-180}
      # Business policies (jahez_api/config/jahez.php, docs/deployment.md §2). Each default
      # is the application's own; leave a policy unset until the owner decides it.
      JAHEZ_BUSINESS_TIMEZONE: ${JAHEZ_BUSINESS_TIMEZONE:-Africa/Cairo}
      JAHEZ_FACTORY_APPROVAL_REQUIRED: ${JAHEZ_FACTORY_APPROVAL_REQUIRED:-true}
      JAHEZ_FACTORY_LEGAL_CHANGES_REVIEWED: ${JAHEZ_FACTORY_LEGAL_CHANGES_REVIEWED:-true}
      JAHEZ_FACTORY_REQUIRED_FIELDS: ${JAHEZ_FACTORY_REQUIRED_FIELDS:-sectors}
      JAHEZ_PROVIDER_REQUIRED_FIELDS: ${JAHEZ_PROVIDER_REQUIRED_FIELDS:-}
      JAHEZ_DIRECTORY_SHOWS_CONTACT_DETAILS: ${JAHEZ_DIRECTORY_SHOWS_CONTACT_DETAILS:-false}
      JAHEZ_PROVIDER_EVALUATION_SCALE_MAX: ${JAHEZ_PROVIDER_EVALUATION_SCALE_MAX:-}
      JAHEZ_PROVIDER_EVALUATION_PASS_MARK: ${JAHEZ_PROVIDER_EVALUATION_PASS_MARK:-}
      JAHEZ_MARKETPLACE_SINGLE_AWARD: ${JAHEZ_MARKETPLACE_SINGLE_AWARD:-true}
      JAHEZ_AGREEMENTS_IMC_APPROVAL_REQUIRED: ${JAHEZ_AGREEMENTS_IMC_APPROVAL_REQUIRED:-true}
      JAHEZ_NOTIFICATION_EMAILS: ${JAHEZ_NOTIFICATION_EMAILS:-true}
      JAHEZ_PAYMENT_GATEWAY: ${JAHEZ_PAYMENT_GATEWAY:-}
      JAHEZ_DOCUMENTS_DISK: ${JAHEZ_DOCUMENTS_DISK:-local}
      JAHEZ_LOGO_MAX_KB: ${JAHEZ_LOGO_MAX_KB:-2048}
      JAHEZ_LEGAL_DOCUMENT_MAX_KB: ${JAHEZ_LEGAL_DOCUMENT_MAX_KB:-5120}
      JAHEZ_ANNOUNCEMENT_VIDEO_MAX_KB: ${JAHEZ_ANNOUNCEMENT_VIDEO_MAX_KB:-20480}
      JAHEZ_REGISTRATIONS_PER_HOUR: ${JAHEZ_REGISTRATIONS_PER_HOUR:-10}
      MAIL_MAILER: ${MAIL_MAILER:?Set a real mailer (smtp); the go-live gate refuses log/array}
      MAIL_SCHEME: ${MAIL_SCHEME:-smtp}
      MAIL_HOST: ${MAIL_HOST:?Set the SMTP host}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:?Set the sender address, e.g. noreply@example.com}
    volumes:
      # Uploaded documents and the runtime state live here.
      - api-storage:/var/www/html/storage
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      # The first start migrates and seeds before Apache answers.
      start_period: 120s
    depends_on:
      mysql:
        condition: service_healthy

  queue:
    build: ./jahez_api
    restart: unless-stopped
    # www-data like Apache, so files it writes to the shared volume stay writable by all.
    user: www-data
    # --timeout stays below the queue's retry_after (90 s); --max-time recycles the worker
    # hourly. The pcntl extension (Dockerfile) lets it stop gracefully on SIGTERM.
    command: ["php", "artisan", "queue:work", "--tries=3", "--sleep=3", "--timeout=60", "--max-time=3600"]
    environment:
      APP_NAME: ${APP_NAME:-Jahez}
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_KEY: ${APP_KEY:?Generate with `php artisan key:generate --show` and paste it here}
      APP_URL: ${APP_URL:?Set the public HTTPS API URL, e.g. https://api.example.com}
      FRONTEND_URL: ${FRONTEND_URL:?Set the public HTTPS frontend URL, e.g. https://app.example.com}
      # stderr: the container log (docker logs / Coolify), not a file in the shared volume.
      LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
      LOG_LEVEL: ${LOG_LEVEL:-warning}
      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-jahez}
      DB_USERNAME: ${DB_USERNAME:-jahez}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.docker (local) or the Coolify environment variables}
      SESSION_DRIVER: ${SESSION_DRIVER:-array}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
      CACHE_STORE: ${CACHE_STORE:-database}
      SANCTUM_EXPIRATION: ${SANCTUM_EXPIRATION:-480}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-*}
      API_RATE_LIMIT_PER_MINUTE: ${API_RATE_LIMIT_PER_MINUTE:-60}
      API_USER_RATE_LIMIT_PER_MINUTE: ${API_USER_RATE_LIMIT_PER_MINUTE:-180}
      # Business policies (jahez_api/config/jahez.php, docs/deployment.md §2). Each default
      # is the application's own; leave a policy unset until the owner decides it.
      JAHEZ_BUSINESS_TIMEZONE: ${JAHEZ_BUSINESS_TIMEZONE:-Africa/Cairo}
      JAHEZ_FACTORY_APPROVAL_REQUIRED: ${JAHEZ_FACTORY_APPROVAL_REQUIRED:-true}
      JAHEZ_FACTORY_LEGAL_CHANGES_REVIEWED: ${JAHEZ_FACTORY_LEGAL_CHANGES_REVIEWED:-true}
      JAHEZ_FACTORY_REQUIRED_FIELDS: ${JAHEZ_FACTORY_REQUIRED_FIELDS:-sectors}
      JAHEZ_PROVIDER_REQUIRED_FIELDS: ${JAHEZ_PROVIDER_REQUIRED_FIELDS:-}
      JAHEZ_DIRECTORY_SHOWS_CONTACT_DETAILS: ${JAHEZ_DIRECTORY_SHOWS_CONTACT_DETAILS:-false}
      JAHEZ_PROVIDER_EVALUATION_SCALE_MAX: ${JAHEZ_PROVIDER_EVALUATION_SCALE_MAX:-}
      JAHEZ_PROVIDER_EVALUATION_PASS_MARK: ${JAHEZ_PROVIDER_EVALUATION_PASS_MARK:-}
      JAHEZ_MARKETPLACE_SINGLE_AWARD: ${JAHEZ_MARKETPLACE_SINGLE_AWARD:-true}
      JAHEZ_AGREEMENTS_IMC_APPROVAL_REQUIRED: ${JAHEZ_AGREEMENTS_IMC_APPROVAL_REQUIRED:-true}
      JAHEZ_NOTIFICATION_EMAILS: ${JAHEZ_NOTIFICATION_EMAILS:-true}
      JAHEZ_PAYMENT_GATEWAY: ${JAHEZ_PAYMENT_GATEWAY:-}
      JAHEZ_DOCUMENTS_DISK: ${JAHEZ_DOCUMENTS_DISK:-local}
      JAHEZ_LOGO_MAX_KB: ${JAHEZ_LOGO_MAX_KB:-2048}
      JAHEZ_LEGAL_DOCUMENT_MAX_KB: ${JAHEZ_LEGAL_DOCUMENT_MAX_KB:-5120}
      JAHEZ_ANNOUNCEMENT_VIDEO_MAX_KB: ${JAHEZ_ANNOUNCEMENT_VIDEO_MAX_KB:-20480}
      JAHEZ_REGISTRATIONS_PER_HOUR: ${JAHEZ_REGISTRATIONS_PER_HOUR:-10}
      MAIL_MAILER: ${MAIL_MAILER:?Set a real mailer (smtp); the go-live gate refuses log/array}
      MAIL_SCHEME: ${MAIL_SCHEME:-smtp}
      MAIL_HOST: ${MAIL_HOST:?Set the SMTP host}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:?Set the sender address, e.g. noreply@example.com}
    volumes:
      - api-storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
      api:
        condition: service_healthy

  scheduler:
    # Runs the Laravel scheduler (routes/console.php: token and failed-job pruning,
    # expired reset tokens, payments:reconcile) every minute, so no host cron is needed.
    build: ./jahez_api
    restart: unless-stopped
    user: www-data
    command: ["php", "artisan", "schedule:work"]
    environment:
      APP_NAME: ${APP_NAME:-Jahez}
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_KEY: ${APP_KEY:?Generate with `php artisan key:generate --show` and paste it here}
      APP_URL: ${APP_URL:?Set the public HTTPS API URL, e.g. https://api.example.com}
      FRONTEND_URL: ${FRONTEND_URL:?Set the public HTTPS frontend URL, e.g. https://app.example.com}
      # stderr: the container log (docker logs / Coolify), not a file in the shared volume.
      LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
      LOG_LEVEL: ${LOG_LEVEL:-warning}
      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-jahez}
      DB_USERNAME: ${DB_USERNAME:-jahez}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.docker (local) or the Coolify environment variables}
      SESSION_DRIVER: ${SESSION_DRIVER:-array}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
      CACHE_STORE: ${CACHE_STORE:-database}
      SANCTUM_EXPIRATION: ${SANCTUM_EXPIRATION:-480}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-*}
      API_RATE_LIMIT_PER_MINUTE: ${API_RATE_LIMIT_PER_MINUTE:-60}
      API_USER_RATE_LIMIT_PER_MINUTE: ${API_USER_RATE_LIMIT_PER_MINUTE:-180}
      # Business policies (jahez_api/config/jahez.php, docs/deployment.md §2). Each default
      # is the application's own; leave a policy unset until the owner decides it.
      JAHEZ_BUSINESS_TIMEZONE: ${JAHEZ_BUSINESS_TIMEZONE:-Africa/Cairo}
      JAHEZ_FACTORY_APPROVAL_REQUIRED: ${JAHEZ_FACTORY_APPROVAL_REQUIRED:-true}
      JAHEZ_FACTORY_LEGAL_CHANGES_REVIEWED: ${JAHEZ_FACTORY_LEGAL_CHANGES_REVIEWED:-true}
      JAHEZ_FACTORY_REQUIRED_FIELDS: ${JAHEZ_FACTORY_REQUIRED_FIELDS:-sectors}
      JAHEZ_PROVIDER_REQUIRED_FIELDS: ${JAHEZ_PROVIDER_REQUIRED_FIELDS:-}
      JAHEZ_DIRECTORY_SHOWS_CONTACT_DETAILS: ${JAHEZ_DIRECTORY_SHOWS_CONTACT_DETAILS:-false}
      JAHEZ_PROVIDER_EVALUATION_SCALE_MAX: ${JAHEZ_PROVIDER_EVALUATION_SCALE_MAX:-}
      JAHEZ_PROVIDER_EVALUATION_PASS_MARK: ${JAHEZ_PROVIDER_EVALUATION_PASS_MARK:-}
      JAHEZ_MARKETPLACE_SINGLE_AWARD: ${JAHEZ_MARKETPLACE_SINGLE_AWARD:-true}
      JAHEZ_AGREEMENTS_IMC_APPROVAL_REQUIRED: ${JAHEZ_AGREEMENTS_IMC_APPROVAL_REQUIRED:-true}
      JAHEZ_NOTIFICATION_EMAILS: ${JAHEZ_NOTIFICATION_EMAILS:-true}
      JAHEZ_PAYMENT_GATEWAY: ${JAHEZ_PAYMENT_GATEWAY:-}
      JAHEZ_DOCUMENTS_DISK: ${JAHEZ_DOCUMENTS_DISK:-local}
      JAHEZ_LOGO_MAX_KB: ${JAHEZ_LOGO_MAX_KB:-2048}
      JAHEZ_LEGAL_DOCUMENT_MAX_KB: ${JAHEZ_LEGAL_DOCUMENT_MAX_KB:-5120}
      JAHEZ_ANNOUNCEMENT_VIDEO_MAX_KB: ${JAHEZ_ANNOUNCEMENT_VIDEO_MAX_KB:-20480}
      JAHEZ_REGISTRATIONS_PER_HOUR: ${JAHEZ_REGISTRATIONS_PER_HOUR:-10}
      MAIL_MAILER: ${MAIL_MAILER:?Set a real mailer (smtp); the go-live gate refuses log/array}
      MAIL_SCHEME: ${MAIL_SCHEME:-smtp}
      MAIL_HOST: ${MAIL_HOST:?Set the SMTP host}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:?Set the sender address, e.g. noreply@example.com}
    volumes:
      - api-storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
      api:
        condition: service_healthy

  frontend:
    build:
      context: ./front
      args:
        # Required: the bundle cannot reach the API without it (no localhost fallback).
        VITE_API_BASE_URL: ${FRONT_API_URL:?Set FRONT_API_URL to the public API base URL, e.g. https://api.example.com/api/v1}
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      - api

volumes:
  mysql-data:
  api-storage:
