# Static hosting for the built frontend, with an SPA fallback: unknown paths
# render index.html so React Router owns every route.
server_tokens off;

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/css application/javascript application/json image/svg+xml;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static assets: cache aggressively (Vite fingerprints file names).
    location /assets/ {
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The entry document names the current fingerprinted assets: always revalidate it,
    # so a deploy is picked up at once instead of a stale page asking for removed files.
    location = /index.html {
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        include /etc/nginx/security-headers.inc;
        try_files $uri $uri/ /index.html;
    }
}
