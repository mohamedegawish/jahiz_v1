# Static hosting for the built frontend, with an SPA fallback: unknown paths
# render index.html so React Router owns every route.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static assets: cache aggressively (Vite fingerprints file names).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
