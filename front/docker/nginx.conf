# Static hosting for the built frontend, with an SPA fallback: unknown paths
# render index.html so React Router owns every route. /api/ is forwarded to the
# Laravel API over the Docker network, so the browser calls the API on this same
# origin (one domain, one certificate, no CORS preflight).
#
# This file is an nginx image template (/etc/nginx/templates): at container start the
# API_UPSTREAM placeholder below is replaced from the environment (default http://api:80,
# the `api` service of docker-compose.yml; see the Dockerfile). Only that one is replaced.
server_tokens off;

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/css application/javascript application/json image/svg+xml;

# Docker's embedded DNS. The API host is resolved per request (proxy_pass with a
# variable), so nginx starts even while the API is down, and follows the API's new
# address after it is recreated.
resolver 127.0.0.11 valid=10s ipv6=off;

# The Coolify proxy (Traefik) reaches this container from a private Docker address and
# names the client in X-Forwarded-For. Take the client address from there, so the API's
# per-IP rate limit and logs see the visitor rather than the proxy. Recursive: an address
# a client wrote into the header itself is never trusted, only private hops are skipped.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# TLS ends at the Coolify proxy: pass on the scheme and port the browser used.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}
map $http_x_forwarded_port $forwarded_port {
    default $http_x_forwarded_port;
    ''      $server_port;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The API, before the SPA fallback: the request path, query string, method and body
    # are passed on unchanged (/api/v1/... reaches Laravel as /api/v1/...). No security
    # headers are added here: the API sends its own (app/Http/Middleware/SecurityHeaders.php).
    location ^~ /api/ {
        set $api_upstream ${API_UPSTREAM};
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Laravel's TRUSTED_PROXIES=* trusts this container and reads the right-most
        # entry, which is the client address resolved above.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $forwarded_port;
        # Laravel trusts this header from us too; never pass on a client's value.
        proxy_set_header X-Forwarded-Prefix "";

        # Uploads: matches post_max_size in jahez_api/docker/php.ini (three files per
        # registration, announcement videos up to 20 MB).
        client_max_body_size 30m;

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # The API cannot be reached (down, restarting, or not on this network): answer in
        # JSON like the API does, never with the SPA's HTML.
        error_page 502 504 = @api_unavailable;
    }

    location @api_unavailable {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 502 '{"message":"The API is temporarily unavailable.","code":"api_unavailable"}';
    }

    # Static assets: cache aggressively (Vite fingerprints file names).
    location /assets/ {
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The entry document names the current fingerprinted assets: always revalidate it,
    # so a deploy is picked up at once instead of a stale page asking for removed files.
    location = /index.html {
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        include /etc/nginx/security-headers.inc;
        try_files $uri $uri/ /index.html;
    }
}
