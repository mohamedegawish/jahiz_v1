; Production PHP settings of the Jahez API image (copied into $PHP_INI_DIR/conf.d).
; Applies to Apache and to the CLI (queue worker, scheduler, artisan).

expose_php = Off
display_errors = Off
log_errors = On
memory_limit = 256M

; Uploads (config/jahez.php): logos 2 MB, legal documents 5 MB, announcement videos
; 20 MB, and a registration sends up to three files in one request. Keep these above
; the largest JAHEZ_*_MAX_KB; `app:check-production` warns when they are not.
upload_max_filesize = 25M
post_max_size = 30M
max_file_uploads = 10

; The code never changes inside a running container: skip file timestamp checks.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
